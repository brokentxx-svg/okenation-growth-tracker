name: Okenation Live Telemetry Sync

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC = 08:00, 14:00, 20:00, 02:00 MYT)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allows manual run button in GitHub web UI

permissions:
  contents: write

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run live telemetry fetcher
        run: python scripts/live_tracker.py

      - name: Commit and push updated metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add standalone.html index.html data/snapshots.json
          git diff --staged --quiet || (git commit -m "chore(telemetry): live snapshot sync [skip ci]" && git push)
